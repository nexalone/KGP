<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - KGP SMPN 1 Kaliwedi</title>
  <link rel="icon" href="Icon_KGP1.png" type="image/png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #fff;
      border-radius: 18px;
      padding: 40px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
      text-align: center;
    }
    .icon-box {
      width: 80px; height: 80px; margin: 0 auto 18px;
      background: rgba(102,126,234,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
    }
    h1 { color: #1e3c72; font-size: 1.1rem; margin-bottom: 6px; }
    h2 { color: #aaa; font-size: 0.78rem; font-weight: 400; margin-bottom: 18px; }
    #pesan { color: #666; font-size: 0.9rem; line-height: 1.6; }
    .nama-tampil { color: #1e3c72; font-weight: 700; font-size: 1.1rem; margin-top: 4px; display: block; }
    .spinner {
      width: 32px; height: 32px; border: 4px solid #e4e6ff; border-top-color: #667eea;
      border-radius: 50%; margin: 4px auto 18px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-kembali {
      margin-top: 20px; display: inline-block; padding: 11px 22px; border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; text-decoration: none;
      font-size: 0.85rem; font-weight: 700;
    }
    .btn-kembali:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon-box" id="iconBox">🔑</div>
    <h1>KGP SMP NEGERI 1 KALIWEDI</h1>
    <h2>Masuk melalui link akses</h2>
    <div class="spinner" id="spinner"></div>
    <p id="pesan">Memeriksa link akses...</p>
  </div>

  <script>
    const GITHUB_BASE = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/';
    const ANGGOTA_URL = GITHUB_BASE + 'anggota.csv';

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(v => v.replace(/^"|"$/g, '').trim());
    }
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length === 0) return [];
      const headers = parseCSVLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }

    function tampilkanError(pesan) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('iconBox').textContent = '⚠️';
      document.getElementById('pesan').innerHTML = pesan + '<br><a class="btn-kembali" href="login.html">Ke Halaman Login Admin</a>';
    }

    async function autoLogin() {
      const params = new URLSearchParams(window.location.search);
      const noid = params.get('noid');

      if (!noid) {
        tampilkanError('❌ Link akses tidak valid atau tidak lengkap.');
        return;
      }

      try {
        const resp = await fetch(ANGGOTA_URL + '?t=' + Date.now());
        if (!resp.ok) throw new Error('Gagal mengambil data anggota');
        const dataAnggota = parseCSV(await resp.text()).filter(a => a.NOID && a.NOID.toUpperCase() !== 'NOID');

        const anggota = dataAnggota.find(a => a.NOID === noid);
        if (!anggota) {
          tampilkanError('❌ Anggota untuk link ini tidak ditemukan. Mungkin link sudah tidak berlaku.');
          return;
        }
        if ((anggota.STATUS || '').toUpperCase() !== 'AKTIF') {
          tampilkanError('❌ Anggota ini sudah tidak aktif. Hubungi Bendahara.');
          return;
        }

        const jabatan = (anggota.JABATAN || '').trim().toLowerCase();
        const role = jabatan === 'bendahara' ? 'admin' : 'anggota';
        const bisaBagikan = ['bendahara', 'ketua', 'sekretaris'].includes(jabatan);
        sessionStorage.setItem('kgpSesi', JSON.stringify({ role: role, noid: anggota.NOID, nama: anggota.NAMA, bisaBagikan: bisaBagikan }));

        document.getElementById('spinner').style.display = 'none';
        document.getElementById('iconBox').textContent = '✅';
        document.getElementById('pesan').innerHTML = 'Selamat datang,<span class="nama-tampil">' + anggota.NAMA + '</span>';
        setTimeout(() => { window.location.href = 'Index.html'; }, 700);
      } catch (e) {
        console.error(e);
        tampilkanError('❌ Gagal memeriksa data. Cek koneksi internet lalu buka kembali link ini.');
      }
    }

    autoLogin();
  </script>
</body>
</html>
