<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - KGP SMPN 1 Kaliwedi</title>
  <link rel="icon" href="Icon_KGP1.png" type="image/png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      background: #fff;
      border-radius: 18px;
      padding: 35px 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo-container {
      width: 80px; height: 80px; margin: 0 auto 18px;
      background: rgba(102,126,234,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
    }
    h1 { color: #1e3c72; font-size: 1.15rem; margin-bottom: 4px; }
    h2 { color: #888; font-size: 0.82rem; font-weight: 400; margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #1e3c72; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 0.95rem;
    }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn-login {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px;
    }
    .btn-login:hover { opacity: 0.92; }
    .error-msg {
      background: #ffebee; color: #c62828; padding: 10px 12px; border-radius: 8px;
      font-size: 0.82rem; margin-bottom: 14px; display: none;
    }
    .hint { margin-top: 18px; font-size: 0.72rem; color: #aaa; line-height: 1.6; text-align: left; background: #fafbff; border-radius: 10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-container">🔐</div>
    <h1>KGP SMP NEGERI 1 KALIWEDI</h1>
    <h2>Login khusus Admin</h2>

    <div class="error-msg" id="errorMsg"></div>

    <form id="formLogin">
      <div class="form-group">
        <label for="userId">Username Admin</label>
        <input type="text" id="userId" placeholder="admin" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
    </form>

    <div class="hint">
      🔗 <b>Anggota</b> tidak login manual di sini — gunakan link akses pribadi yang dibagikan oleh Bendahara (via WhatsApp).<br /><br />
      Jika link akses Anda tidak berfungsi lagi, hubungi Bendahara untuk mendapatkan link baru.
    </div>
  </div>

  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'admin123456';

    // Kalau sudah login, langsung lempar ke Index
    if (sessionStorage.getItem('kgpSesi')) {
      window.location.href = 'Index.html';
    }

    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;

      if (userId.toLowerCase() === ADMIN_USER && password === ADMIN_PASS) {
        sessionStorage.setItem('kgpSesi', JSON.stringify({ role: 'admin', noid: null, nama: 'Admin/Bendahara', bisaBagikan: true }));
        window.location.href = 'Index.html';
        return;
      }

      errorMsg.textContent = '❌ Username atau password salah.';
      errorMsg.style.display = 'block';
    });
  </script>
</body>
</html>
