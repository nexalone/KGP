<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi Keuangan - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error { background: #ffebee; color: #c62828; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card h3 { font-size: 1.5rem; margin-bottom: 5px; }
    .stat-card p { font-size: 0.9rem; opacity: 0.9; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #1e3c72;
    }
    .form-group input[readonly] {
      background: #f8f9fa;
      cursor: not-allowed;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: #1e3c72; color: #fff; }
    tr:hover { background: #f8f9fa; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>TRANSAKSI KEUANGAN KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    <div id="statusBar" class="status-bar">🔄 Memuat data...</div>
    
    <div class="stats">
      <div class="stat-card"><h3 id="totalIuran">Rp 0</h3><p>Total Iuran/Kredit</p></div>
      <div class="stat-card"><h3 id="totalTransaksi">0</h3><p>Jumlah Transaksi</p></div>
      <div class="stat-card"><h3 id="saldoKas">Rp 0</h3><p>Saldo Kas</p></div>
    </div>

    <h3 style="margin-bottom: 20px; color: #1e3c72;"> Input Transaksi Baru</h3>
    <form id="formTransaksi">
      <div class="form-grid">
        <div class="form-group">
          <label for="timestamp">Time Stamp *</label>
          <input type="datetime-local" id="timestamp" required />
        </div>
        <div class="form-group">
          <label for="transaksi">Transaksi *</label>
          <select id="transaksi" required><option value="">-- Pilih --</option></select>
        </div>
        <div class="form-group">
          <label for="kode">Kode Anggota *</label>
          <select id="kode" required><option value="">-- Pilih Kode --</option></select>
        </div>
        <div class="form-group">
          <label for="nama">Nama Anggota</label>
          <input type="text" id="nama" readonly placeholder="Otomatis..." />
        </div>
        <div class="form-group">
          <label for="caraBayar">Cara Bayar *</label>
          <select id="caraBayar" required><option value="">-- Pilih --</option></select>
        </div>
        <div class="form-group">
          <label for="nominal">Nominal (Rp) *</label>
          <input type="number" id="nominal" placeholder="0" min="0" required />
        </div>
        <div class="form-group full">
          <label for="keterangan">Keterangan</label>
          <input type="text" id="keterangan" placeholder="Keterangan..." />
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnSubmit">💾 Simpan Transaksi</button>
      <button type="reset" class="btn btn-secondary">🔄 Reset</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #1e3c72;"> Riwayat Transaksi (<span id="jumlahTransaksi">0</span>)</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Time Stamp</th><th>Transaksi</th><th>Kode</th><th>Nama</th><th>Cara Bayar</th><th>Nominal</th><th>Keterangan</th></tr>
        </thead>
        <tbody id="tabelTransaksi">
          <tr><td colspan="7" style="text-align:center;padding:20px;">Memuat...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '151XT0NLPb7fljwUOe_PP3dhD_-dPhBmA_jrffxGZWjQ';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';
    const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
    const SHEET2_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet2`;
    const SHEET3_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet3`;
    
    let dataTransaksi = [], dataAnggota = [], dataReferensi = { transaksi: [], caraBayar: [] };

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(v => v.trim());
    }

    function parseCSV(text, skipTitle = true) {
      const lines = text.trim().split('\n');
      const result = [];
      const startIdx = skipTitle ? 1 : 0;
      const headers = parseCSVLine(lines[startIdx]);
      for (let i = startIdx + 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }

    async function loadAllData() {
      const statusBar = document.getElementById('statusBar');
      try {
        const [r1, r2, r3] = await Promise.all([
          fetch(SHEET1_URL + '&t=' + Date.now()),
          fetch(SHEET2_URL + '&t=' + Date.now()),
          fetch(SHEET3_URL + '&t=' + Date.now())
        ]);
        if (!r1.ok || !r2.ok || !r3.ok) throw new Error('Gagal');
        const [t1, t2, t3] = await Promise.all([r1.text(), r2.text(), r3.text()]);
        
        dataAnggota = parseCSV(t1, true);
        dataTransaksi = parseCSV(t2, true);
        
        const lines3 = t3.trim().split('\n');
        if (lines3.length > 1) {
          const headers3 = parseCSVLine(lines3[0]);
          for (let i = 1; i < lines3.length; i++) {
            if (!lines3[i].trim()) continue;
            const vals = parseCSVLine(lines3[i]);
            const obj = {};
            headers3.forEach((h, idx) => { obj[h] = vals[idx] || ''; });
            if (obj.TRANSAKSI) dataReferensi.transaksi.push(obj.TRANSAKSI);
            if (obj['MODE BAYAR']) dataReferensi.caraBayar.push(obj['MODE BAYAR']);
          }
        }

        populateDropdowns();
        renderTabel();
        hitungStatistik();
        statusBar.textContent = `✅ Data dimuat: ${dataAnggota.length} anggota, ${dataTransaksi.length} transaksi`;
        statusBar.className = 'status-bar success';
      } catch (e) {
        statusBar.textContent = '❌ Gagal memuat data.';
        statusBar.className = 'status-bar error';
      }
    }

    function populateDropdowns() {
      const selT = document.getElementById('transaksi');
      selT.innerHTML = '<option value="">-- Pilih --</option>';
      dataReferensi.transaksi.forEach(t => { if (t) selT.innerHTML += `<option value="${t}">${t}</option>`; });

      const selK = document.getElementById('kode');
      selK.innerHTML = '<option value="">-- Pilih Kode --</option>';
      dataAnggota.forEach(a => {
        if (a.KODE) selK.innerHTML += `<option value="${a.KODE}" data-nama="${a.NAMA || ''}">${a.KODE} - ${a.NAMA || ''}</option>`;
      });

      const selC = document.getElementById('caraBayar');
      selC.innerHTML = '<option value="">-- Pilih --</option>';
      dataReferensi.caraBayar.forEach(c => { if (c) selC.innerHTML += `<option value="${c}">${c}</option>`; });
    }

    document.getElementById('kode').addEventListener('change', function() {
      document.getElementById('nama').value = this.options[this.selectedIndex].getAttribute('data-nama') || '';
    });

    function setCurrentTimestamp() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('timestamp').value = now.toISOString().slice(0, 16);
    }
    setCurrentTimestamp();

    document.getElementById('formTransaksi').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const btnSubmit = document.getElementById('btnSubmit');
      const originalText = btnSubmit.innerHTML;
      btnSubmit.innerHTML = '<span class="loading"></span> Menyimpan...';
      btnSubmit.disabled = true;

      const data = {
        sheet: 'Sheet2',
        timestamp: document.getElementById('timestamp').value.replace('T', ' '),
        transaksi: document.getElementById('transaksi').value,
        kode: document.getElementById('kode').value,
        caraBayar: document.getElementById('caraBayar').value,
        nominal: document.getElementById('nominal').value,
        keterangan: document.getElementById('keterangan').value
      };

      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        statusBar.textContent = '✅ Transaksi berhasil disimpan!';
        statusBar.className = 'status-bar success';
        this.reset();
        setCurrentTimestamp();
        await loadAllData();
      } catch (err) {
        statusBar.textContent = '❌ Gagal menyimpan.';
        statusBar.className = 'status-bar error';
      } finally {
        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;
      }
    });

    function renderTabel() {
      const tbody = document.getElementById('tabelTransaksi');
      document.getElementById('jumlahTransaksi').textContent = dataTransaksi.length;
      if (dataTransaksi.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = dataTransaksi.map(t => `
        <tr>
          <td>${t['TIME STAMP'] || '-'}</td>
          <td>${t.TRANSAKSI || '-'}</td>
          <td>${t.KODE || '-'}</td>
          <td>${t.NAMA || '-'}</td>
          <td>${t['CARA BAYAR'] || '-'}</td>
          <td>Rp ${parseInt(t.NOMINAL || 0).toLocaleString('id-ID')}</td>
          <td>${t.KETERANGAN || '-'}</td>
        </tr>
      `).join('');
    }

    function hitungStatistik() {
      let total = 0, saldo = 0;
      dataTransaksi.forEach(t => {
        const n = parseInt(t.NOMINAL) || 0;
        total += n; saldo += n;
      });
      document.getElementById('totalIuran').textContent = 'Rp ' + total.toLocaleString('id-ID');
      document.getElementById('totalTransaksi').textContent = dataTransaksi.length;
      document.getElementById('saldoKas').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
    }

    loadAllData();
  </script>
</body>
</html>
