<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi Keuangan - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; font-size: 1.5rem; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .nav-back:hover { background: #2a5298; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group.full { grid-column: 1 / -1; }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #1e3c72;
    }
    .form-group input[readonly] {
      background: #f8f9fa;
      color: #555;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }

    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #1e3c72;
      color: #fff;
      font-weight: 600;
    }
    tr:hover { background: #f8f9fa; }
    .btn-hapus {
      padding: 5px 10px;
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    
    <header>
      <h1>TRANSAKSI KEUANGAN</h1>
      <h2>Kesejahteraan Guru dan Pegawai - SMP Negeri 1 Kaliwedi</h2>
    </header>

    <h3 style="margin-bottom: 20px; color: #1e3c72;"> Input Transaksi Baru</h3>
    <form id="formTransaksi">
      <div class="form-grid">
        <!-- TIME STAMP -->
        <div class="form-group">
          <label for="timestamp">Time Stamp</label>
          <input type="datetime-local" id="timestamp" required />
        </div>

        <!-- TRANSAKSI (Dari Sheet3!A2:A) -->
        <div class="form-group">
          <label for="transaksi">Transaksi</label>
          <select id="transaksi" required>
            <option value="">-- Pilih Transaksi --</option>
            <!-- ⚠️ SESUAIKAN OPSI INI DENGAN DATA DI SHEET3!A2:A ANDA -->
            <option value="Iuran Wajib">Iuran Wajib</option>
            <option value="Iuran Sukarela">Iuran Sukarela</option>
            <option value="Simpanan">Simpanan</option>
            <option value="Pinjaman">Pinjaman</option>
            <option value="Angsuran Pinjaman">Angsuran Pinjaman</option>
            <option value="Pengeluaran">Pengeluaran</option>
          </select>
        </div>

        <!-- KODE (Dari Sheet1!A:A) -->
        <div class="form-group">
          <label for="kode">Kode Anggota</label>
          <select id="kode" required>
            <option value="">-- Pilih Kode --</option>
          </select>
        </div>

        <!-- NAMA (Otomatis dari Sheet1!B:B) -->
        <div class="form-group">
          <label for="nama">Nama Anggota</label>
          <input type="text" id="nama" readonly placeholder="Otomatis terisi..." />
        </div>

        <!-- CARA BAYAR -->
        <div class="form-group">
          <label for="caraBayar">Cara Bayar</label>
          <select id="caraBayar" required>
            <option value="">-- Pilih Cara Bayar --</option>
            <option value="GAJI">GAJI</option>
            <option value="SERTI">SERTI</option>
            <option value="HONOR">HONOR</option>
            <option value="MANDIRI">MANDIRI</option>
          </select>
        </div>

        <!-- NOMINAL -->
        <div class="form-group">
          <label for="nominal">Nominal (Rp)</label>
          <input type="number" id="nominal" placeholder="0" required />
        </div>

        <!-- KETERANGAN -->
        <div class="form-group full">
          <label for="keterangan">Keterangan</label>
          <input type="text" id="keterangan" placeholder="Keterangan tambahan..." />
        </div>
      </div>

      <button type="submit" class="btn btn-primary">💾 Simpan Transaksi</button>
      <button type="reset" class="btn btn-secondary">🔄 Reset Form</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #1e3c72;">📊 Riwayat Transaksi</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Time Stamp</th>
            <th>Transaksi</th>
            <th>Kode</th>
            <th>Nama</th>
            <th>Cara Bayar</th>
            <th>Nominal</th>
            <th>Keterangan</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelTransaksi">
          <tr>
            <td colspan="8" style="text-align: center; color: #999;">Belum ada data transaksi</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. Set Time Stamp ke waktu saat ini
    function setCurrentTimestamp() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('timestamp').value = now.toISOString().slice(0, 16);
    }
    setCurrentTimestamp();

    // 2. Load Data Anggota (Simulasi Sheet1!A:A dan B:B)
    // Data ini diambil dari localStorage yang disimpan oleh anggota-kgp.html
    function loadAnggota() {
      const data = localStorage.getItem('kgp_anggota');
      const anggota = data ? JSON.parse(data) : [];
      const selectKode = document.getElementById('kode');
      
      // Jika belum ada data di localStorage, gunakan data dummy untuk tes
      const daftarAnggota = anggota.length > 0 ? anggota : [
        { kode: 'KGP001', nama: 'Contoh Nama Guru 1' },
        { kode: 'KGP002', nama: 'Contoh Nama Guru 2' }
      ];

      selectKode.innerHTML = '<option value="">-- Pilih Kode --</option>';
      daftarAnggota.forEach(a => {
        selectKode.innerHTML += `<option value="${a.kode}" data-nama="${a.nama}">${a.kode}</option>`;
      });
    }

    // 3. Logika Otomatis: Pilih Kode -> Muncul Nama (Sheet1!B:B)
    document.getElementById('kode').addEventListener('change', function() {
      const selectedOption = this.options[this.selectedIndex];
      const nama = selectedOption.getAttribute('data-nama') || '';
      document.getElementById('nama').value = nama;
    });

    // 4. Simpan Transaksi
    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const transaksi = {
        id: Date.now(),
        timestamp: document.getElementById('timestamp').value.replace('T', ' '),
        transaksi: document.getElementById('transaksi').value,
        kode: document.getElementById('kode').value,
        nama: document.getElementById('nama').value,
        caraBayar: document.getElementById('caraBayar').value,
        nominal: parseFloat(document.getElementById('nominal').value),
        keterangan: document.getElementById('keterangan').value
      };

      let data = localStorage.getItem('kgp_transaksi');
      let listTransaksi = data ? JSON.parse(data) : [];
      listTransaksi.push(transaksi);
      localStorage.setItem('kgp_transaksi', JSON.stringify(listTransaksi));

      alert('✅ Transaksi berhasil disimpan!');
      this.reset();
      setCurrentTimestamp();
      loadTransaksi();
    });

    // 5. Tampilkan Tabel Transaksi
    function loadTransaksi() {
      const data = localStorage.getItem('kgp_transaksi');
      const list = data ? JSON.parse(data) : [];
      const tbody = document.getElementById('tabelTransaksi');

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #999;">Belum ada data transaksi</td></tr>';
        return;
      }

      let html = '';
      list.forEach((t, index) => {
        html += `
          <tr>
            <td>${t.timestamp}</td>
            <td>${t.transaksi}</td>
            <td>${t.kode}</td>
            <td>${t.nama}</td>
            <td>${t.caraBayar}</td>
            <td>Rp ${t.nominal.toLocaleString('id-ID')}</td>
            <td>${t.keterangan}</td>
            <td><button onclick="hapusTransaksi(${t.id})" class="btn-hapus">🗑</button></td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 6. Hapus Transaksi
    function hapusTransaksi(id) {
      if (confirm('Yakin ingin menghapus transaksi ini?')) {
        let data = localStorage.getItem('kgp_transaksi');
        let list = data ? JSON.parse(data) : [];
        list = list.filter(t => t.id !== id);
        localStorage.setItem('kgp_transaksi', JSON.stringify(list));
        loadTransaksi();
      }
    }

    // Inisialisasi saat halaman dimuat
    loadAnggota();
    loadTransaksi();
  </script>
</body>
</html>
