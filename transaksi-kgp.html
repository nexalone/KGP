<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi Keuangan - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error { background: #ffebee; color: #c62828; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: #eef2fb;
      color: #3a4a6b;
      padding: 12px 14px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #dde4f5;
    }
    .stat-card h3 { font-size: 1rem; margin-bottom: 3px; font-weight: 700; color: #2a5298; }
    .stat-card p { font-size: 0.7rem; opacity: 0.75; letter-spacing: 0.3px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group.hidden { display: none; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #1e3c72;
    }
    .form-group input[readonly] {
      background: #f8f9fa;
      cursor: not-allowed;
    }
    .info-box {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 0.85rem;
      color: #e65100;
      margin-bottom: 15px;
      grid-column: 1 / -1;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }
    th { background: #1e3c72; color: #fff; }
    tr:hover { background: #f8f9fa; }
    .masuk { color: #2e7d32; font-weight: 600; }
    .keluar { color: #c62828; font-weight: 600; }
    .nama-link {
      color: #1e3c72;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px dashed #90a4c9;
      cursor: pointer;
    }
    .nama-link:hover { color: #2a5298; border-bottom-color: #2a5298; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>TRANSAKSI KEUANGAN KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    <div id="statusBar" class="status-bar">🔄 Memuat data...</div>

    <div class="stats">
      <div class="stat-card"><h3 id="totalMasuk">Rp 0</h3><p>Total Masuk</p></div>
      <div class="stat-card"><h3 id="totalKeluar">Rp 0</h3><p>Total Keluar</p></div>
      <div class="stat-card"><h3 id="saldoKas">Rp 0</h3><p>Saldo Kas</p></div>
    </div>

    <h3 style="margin-bottom: 20px; color: #1e3c72;"> Input Transaksi Baru</h3>
    <form id="formTransaksi">
      <div class="form-grid">
        <div class="form-group">
          <label for="jenis">Jenis Transaksi *</label>
          <select id="jenis" required><option value="">-- Pilih --</option></select>
        </div>

        <div class="form-group" id="grpNoid">
          <label for="noid">Anggota *</label>
          <select id="noid"><option value="">-- Pilih Anggota --</option></select>
        </div>

        <div class="form-group" id="grpSlot" hidden>
          <label for="slot">Pinjaman Yang Dibayar *</label>
          <select id="slot"><option value="">-- Pilih Anggota Dulu --</option></select>
        </div>

        <div class="form-group" id="grpJmlCicilan" hidden>
          <label for="jmlCicilan">Jumlah Rencana Angsuran *</label>
          <input type="number" id="jmlCicilan" min="1" placeholder="contoh: 10" />
        </div>

        <div class="form-group">
          <label for="nominal">Nominal (Rp) *</label>
          <input type="number" id="nominal" min="0" placeholder="0" required />
        </div>

        <div class="form-group">
          <label for="caraBayar">Cara Bayar *</label>
          <select id="caraBayar" required>
            <option value="">-- Pilih --</option>
            <option value="GAJI">GAJI</option>
            <option value="SERTI">SERTI</option>
            <option value="HONOR">HONOR</option>
            <option value="TRANSFER">TRANSFER</option>
            <option value="SAKU">SAKU</option>
            <option value="LAINNYA">LAINNYA</option>
          </select>
        </div>

        <div class="info-box" id="infoBox" hidden></div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnSubmit">💾 Simpan Transaksi</button>
      <button type="reset" class="btn btn-secondary" id="btnReset">🔄 Reset</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #1e3c72;"> Riwayat Transaksi (<span id="jumlahTransaksi">0</span>)</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Time Stamp</th><th>NOID</th><th>Nama</th><th>REF</th><th>Masuk</th><th>Keluar</th><th>Cara Bayar</th></tr>
        </thead>
        <tbody id="tabelTransaksi">
          <tr><td colspan="7" style="text-align:center;padding:20px;">Memuat...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const GITHUB_BASE = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/';
    const ANGGOTA_URL = GITHUB_BASE + 'anggota.csv';
    const TRANSAKSI_URL = GITHUB_BASE + 'transaksi.csv';
    const REF_URL = GITHUB_BASE + 'ref.csv';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';

    // Perilaku tiap jenis transaksi (label TIDAK di sini lagi — diambil dari sheet REF kolom KETERANGAN).
    // 'JS' (Jasa) sengaja tidak dimasukkan karena sekarang otomatis, tidak dipilih manual.
    const JENIS_META = {
      'SP':    { butuhNoid: true },
      'SW':    { butuhNoid: true },
      'SHR-S': { butuhNoid: true },
      'SHR-T': { butuhNoid: true },
      'PJM':   { butuhNoid: true, butuhJmlCicilan: true, jmlCicilanDefault: 10 },
      'SMT':   { butuhNoid: true, butuhJmlCicilan: true },
      'CCL':   { butuhNoid: true, butuhSlot: 'K' },
      'CCS':   { butuhNoid: true, butuhSlot: 'KS' },
      'ADM':   { butuhNoid: false },
      'SHU':   { butuhNoid: true }
    };

    let dataAnggota = [], dataTransaksi = [], dataRef = [], pinjamanAktifCache = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(v => v.replace(/^"|"$/g, '').trim());
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length === 0) return [];
      const headers = parseCSVLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }

    function populateJenisDropdown() {
      const sel = document.getElementById('jenis');
      sel.innerHTML = '<option value="">-- Pilih --</option>';
      dataRef
        .filter(r => JENIS_META.hasOwnProperty(r.KODE)) // buang JS & baris tak dikenal
        .sort((a, b) => (Number(a.NO) || 0) - (Number(b.NO) || 0))
        .forEach(r => { sel.innerHTML += `<option value="${r.KODE}">${r.KETERANGAN}</option>`; });
    }

    function populateNoidDropdown() {
      const sel = document.getElementById('noid');
      sel.innerHTML = '<option value="">-- Pilih Anggota --</option>';
      dataAnggota
        .filter(a => (a.STATUS || '').toUpperCase() === 'AKTIF')
        .forEach(a => { sel.innerHTML += `<option value="${a.NOID}">${a.NOID} - ${a.NAMA}</option>`; });
    }

    async function loadAllData() {
      const statusBar = document.getElementById('statusBar');
      try {
        const [rA, rT, rR] = await Promise.all([
          fetch(ANGGOTA_URL + '?t=' + Date.now()),
          fetch(TRANSAKSI_URL + '?t=' + Date.now()),
          fetch(REF_URL + '?t=' + Date.now())
        ]);
        if (!rA.ok || !rT.ok || !rR.ok) throw new Error('Gagal mengambil data dari GitHub');
        const [txtA, txtT, txtR] = await Promise.all([rA.text(), rT.text(), rR.text()]);

        dataAnggota = parseCSV(txtA);
        dataTransaksi = parseCSV(txtT);
        dataRef = parseCSV(txtR);

        populateNoidDropdown();
        populateJenisDropdown();
        renderTabel();
        hitungStatistik();
        statusBar.textContent = `✅ ${dataAnggota.length} anggota, ${dataTransaksi.length} transaksi (dari GitHub)`;
        statusBar.className = 'status-bar success';
      } catch (e) {
        console.error(e);
        statusBar.textContent = '❌ Gagal memuat data dari GitHub.';
        statusBar.className = 'status-bar error';
      }
    }

    function formatRp(n) {
      return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
    }

    function renderTabel() {
      const tbody = document.getElementById('tabelTransaksi');
      const urut = [...dataTransaksi].reverse(); // terbaru di atas
      document.getElementById('jumlahTransaksi').textContent = dataTransaksi.length;
      if (urut.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = urut.map(t => `
        <tr>
          <td>${t['TIME STAMP'] || '-'}</td>
          <td>${t.NOID || '-'}</td>
          <td>${t.NOID ? `<a class="nama-link" href="kartu-anggota.html?noid=${encodeURIComponent(t.NOID)}">${t.NAMA || '-'}</a>` : (t.NAMA || '-')}</td>
          <td>${t.REF || '-'}</td>
          <td class="masuk">${t.MASUK ? formatRp(t.MASUK) : ''}</td>
          <td class="keluar">${t.KELUAR ? formatRp(t.KELUAR) : ''}</td>
          <td>${t['CARA BAYAR'] || '-'}</td>
        </tr>
      `).join('');
    }

    function hitungStatistik() {
      let masuk = 0, keluar = 0;
      dataTransaksi.forEach(t => {
        masuk += Number(t.MASUK) || 0;
        keluar += Number(t.KELUAR) || 0;
      });
      document.getElementById('totalMasuk').textContent = formatRp(masuk);
      document.getElementById('totalKeluar').textContent = formatRp(keluar);
      document.getElementById('saldoKas').textContent = formatRp(masuk - keluar);
    }

    // ===== FORM DINAMIS =====
    function getJenisInfo(kode) {
      return JENIS_META[kode];
    }

    function updateFormTampilan() {
      const kode = document.getElementById('jenis').value;
      const info = getJenisInfo(kode);

      const grpNoid = document.getElementById('grpNoid');
      const grpSlot = document.getElementById('grpSlot');
      const grpJmlCicilan = document.getElementById('grpJmlCicilan');
      const infoBox = document.getElementById('infoBox');

      grpNoid.hidden = !info || !info.butuhNoid;
      grpSlot.hidden = true;
      grpJmlCicilan.hidden = true;
      infoBox.hidden = true;
      document.getElementById('slot').innerHTML = '<option value="">-- Pilih Anggota Dulu --</option>';

      if (!info) return;

      if (info.butuhJmlCicilan) {
        grpJmlCicilan.hidden = false;
        document.getElementById('jmlCicilan').value = info.jmlCicilanDefault || '';
      }

      if (info.butuhSlot === 'K' || info.butuhSlot === 'KS') {
        grpSlot.hidden = false;
        muatPinjamanAktif(info.butuhSlot);
        infoBox.hidden = false;
        infoBox.textContent = 'Jasa 10% dari nominal cicilan otomatis ditambahkan sebagai baris terpisah setiap kali cicilan ini disimpan.';
      }

      if (kode === 'ADM') {
        infoBox.hidden = false;
        infoBox.textContent = 'Biaya operasional tidak terkait anggota tertentu.';
      }
    }

    async function muatPinjamanAktif(jenisPrefix) {
      const noid = document.getElementById('noid').value;
      const selSlot = document.getElementById('slot');
      if (!noid) {
        selSlot.innerHTML = '<option value="">-- Pilih Anggota Dulu --</option>';
        return;
      }
      selSlot.innerHTML = '<option value="">Memuat...</option>';
      try {
        const url = SCRIPT_URL + '?action=pinjamanAktif&noid=' + encodeURIComponent(noid) + '&jenis=' + jenisPrefix;
        const resp = await fetch(url);
        const json = await resp.json();
        if (!json.success) throw new Error(json.error || 'Gagal memuat');
        pinjamanAktifCache = json.data || [];
        if (pinjamanAktifCache.length === 0) {
          selSlot.innerHTML = '<option value="">Tidak ada pinjaman aktif</option>';
          return;
        }
        selSlot.innerHTML = '<option value="">-- Pilih --</option>' + pinjamanAktifCache.map(p =>
          `<option value="${p.slot}">Slot ${p.slot} — Sisa ${formatRp(p.sisaPokok)} — Angsuran ke-${p.angsuranKeBerikutnya} dari ${p.jmlCicilan}</option>`
        ).join('');
      } catch (e) {
        console.error(e);
        selSlot.innerHTML = '<option value="">Gagal memuat pinjaman aktif</option>';
      }
    }

    document.getElementById('jenis').addEventListener('change', updateFormTampilan);
    document.getElementById('noid').addEventListener('change', function() {
      const kode = document.getElementById('jenis').value;
      const info = getJenisInfo(kode);
      if (info && info.butuhSlot === 'K') muatPinjamanAktif('K');
      else if (info && info.butuhSlot === 'KS') muatPinjamanAktif('KS');
    });

    document.getElementById('formTransaksi').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const btnSubmit = document.getElementById('btnSubmit');
      const originalText = btnSubmit.innerHTML;

      const kode = document.getElementById('jenis').value;
      const info = getJenisInfo(kode);
      if (!info) return;

      const payload = {
        action: 'tambahTransaksi',
        kode: kode,
        noid: document.getElementById('noid').value,
        nominal: document.getElementById('nominal').value,
        caraBayar: document.getElementById('caraBayar').value
      };

      if (info.butuhJmlCicilan) {
        payload.jmlCicilan = document.getElementById('jmlCicilan').value;
      }
      if (info.butuhSlot === 'K' || info.butuhSlot === 'KS') {
        payload.x = document.getElementById('slot').value;
        if (!payload.x) { alert('Pilih dulu pinjaman yang mau dibayar.'); return; }
      }
      if (info.butuhNoid && !payload.noid) { alert('Pilih dulu anggotanya.'); return; }

      btnSubmit.innerHTML = '<span class="loading"></span> Menyimpan...';
      btnSubmit.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        // ===== UPDATE TAMPILAN LANGSUNG (tidak nunggu GitHub) =====
        const namaAnggota = payload.noid ? (dataAnggota.find(a => a.NOID === payload.noid)?.NAMA || '') : '';
        const arahMasuk = ['SP', 'SW', 'SHR-S', 'CCL', 'CCS', 'JS'].includes(kode);
        dataTransaksi.push({
          'TIME STAMP': new Date().toLocaleString('id-ID'),
          'NOID': payload.noid || '',
          'NAMA': namaAnggota,
          'REF': '(diproses...)',
          'MASUK': arahMasuk ? payload.nominal : '',
          'KELUAR': !arahMasuk ? payload.nominal : '',
          'JML CICILAN': payload.jmlCicilan || '',
          'CARA BAYAR': payload.caraBayar
        });
        renderTabel();
        hitungStatistik();
        // ============================================================

        statusBar.textContent = '✅ Transaksi berhasil disimpan!';
        statusBar.className = 'status-bar success';
        this.reset();
        updateFormTampilan();
        setTimeout(() => loadAllData(), 4000); // ganti dengan data resmi dari GitHub setelah beberapa detik
      } catch (err) {
        console.error(err);
        statusBar.textContent = '❌ Gagal menyimpan.';
        statusBar.className = 'status-bar error';
      } finally {
        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;
      }
    });

    loadAllData();
  </script>
</body>
</html>
