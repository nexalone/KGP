<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi Keuangan - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #667eea;
    }
    header h1 { color: #667eea; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #667eea;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #5568d3; }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-primary:hover { background: #5568d3; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #ddd;
    }
    th {
      background: #667eea;
      color: #fff;
      font-weight: 600;
    }
    tr:hover { background: #f8f9fa; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-card h3 { font-size: 2rem; margin-bottom: 5px; }
    .stat-card p { font-size: 0.9rem; opacity: 0.9; }

    @media (max-width: 768px) {
      .container { padding: 20px; }
      table { font-size: 0.9rem; }
      th, td { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    
    <header>
      <h1>TRANSAKSI KEUANGAN</h1>
      <h2>Kesejahteraan Guru dan Pegawai - SMP Negeri 1 Kaliwedi</h2>
    </header>

    <div class="stats">
      <div class="stat-card">
        <h3>Rp 0</h3>
        <p>Total Iuran</p>
      </div>
      <div class="stat-card">
        <h3>Rp 0</h3>
        <p>Total Simpanan</p>
      </div>
      <div class="stat-card">
        <h3>Rp 0</h3>
        <p>Saldo Kas</p>
      </div>
    </div>

    <h3 style="margin-bottom: 20px; color: #333;">📝 Input Transaksi Baru</h3>
    <form id="formTransaksi">
      <div class="form-group">
        <label for="tanggal">Tanggal Transaksi</label>
        <input type="date" id="tanggal" required />
      </div>
      
      <div class="form-group">
        <label for="jenis">Jenis Transaksi</label>
        <select id="jenis" required>
          <option value="">-- Pilih Jenis --</option>
          <option value="iuran">Iuran Anggota</option>
          <option value="simpanan">Simpanan</option>
          <option value="pinjaman">Pinjaman</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>
      </div>

      <div class="form-group">
        <label for="anggota">Nama Anggota</label>
        <select id="anggota" required>
          <option value="">-- Pilih Anggota --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="jumlah">Jumlah (Rp)</label>
        <input type="number" id="jumlah" placeholder="0" required />
      </div>

      <div class="form-group">
        <label for="keterangan">Keterangan</label>
        <textarea id="keterangan" rows="3" placeholder="Keterangan transaksi..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary">💾 Simpan Transaksi</button>
      <button type="reset" class="btn btn-secondary">🔄 Reset</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #333;">📊 Daftar Transaksi</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Tanggal</th>
          <th>Jenis</th>
          <th>Anggota</th>
          <th>Jumlah</th>
          <th>Keterangan</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelTransaksi">
        <tr>
          <td colspan="7" style="text-align: center; color: #999;">Belum ada data transaksi</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Set tanggal hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    // Load data anggota dari localStorage
    function loadAnggota() {
      const data = localStorage.getItem('kgp_anggota');
      const anggota = data ? JSON.parse(data) : [];
      const select = document.getElementById('anggota');
      
      if (anggota.length > 0) {
        select.innerHTML = '<option value="">-- Pilih Anggota --</option>';
        anggota.forEach(a => {
          select.innerHTML += `<option value="${a.kode}">${a.nama}</option>`;
        });
      }
    }

    // Simpan transaksi
    document.getElementById('formTransaksi').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const transaksi = {
        id: Date.now(),
        tanggal: document.getElementById('tanggal').value,
        jenis: document.getElementById('jenis').value,
        anggota: document.getElementById('anggota').value,
        jumlah: parseFloat(document.getElementById('jumlah').value),
        keterangan: document.getElementById('keterangan').value
      };

      // Simpan ke localStorage
      let data = localStorage.getItem('kgp_transaksi');
      let listTransaksi = data ? JSON.parse(data) : [];
      listTransaksi.push(transaksi);
      localStorage.setItem('kgp_transaksi', JSON.stringify(listTransaksi));

      alert('Transaksi berhasil disimpan!');
      this.reset();
      document.getElementById('tanggal').valueAsDate = new Date();
      loadTransaksi();
    });

    // Load dan tampilkan transaksi
    function loadTransaksi() {
      const data = localStorage.getItem('kgp_transaksi');
      const list = data ? JSON.parse(data) : [];
      const tbody = document.getElementById('tabelTransaksi');

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999;">Belum ada data transaksi</td></tr>';
        return;
      }

      let html = '';
      list.forEach((t, index) => {
        const jenisText = {
          'iuran': 'Iuran',
          'simpanan': 'Simpanan',
          'pinjaman': 'Pinjaman',
          'pengeluaran': 'Pengeluaran'
        }[t.jenis] || t.jenis;

        html += `
          <tr>
            <td>${index + 1}</td>
            <td>${t.tanggal}</td>
            <td>${jenisText}</td>
            <td>${t.anggota}</td>
            <td>Rp ${t.jumlah.toLocaleString('id-ID')}</td>
            <td>${t.keterangan}</td>
            <td><button onclick="hapusTransaksi(${t.id})" style="padding: 5px 10px; background: #dc3545; color: #fff; border: none; border-radius: 5px; cursor: pointer;">🗑 Hapus</button></td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    // Hapus transaksi
    function hapusTransaksi(id) {
      if (confirm('Yakin ingin menghapus transaksi ini?')) {
        let data = localStorage.getItem('kgp_transaksi');
        let list = data ? JSON.parse(data) : [];
        list = list.filter(t => t.id !== id);
        localStorage.setItem('kgp_transaksi', JSON.stringify(list));
        loadTransaksi();
      }
    }

    // Load data saat halaman dibuka
    loadAnggota();
    loadTransaksi();
  </script>
</body>
</html>
