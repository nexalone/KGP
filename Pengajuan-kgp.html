<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    (function() {
      const sesiStr = sessionStorage.getItem("kgpSesi");
      if (!sesiStr) { window.location.href = "login.html"; return; }
      const sesi = JSON.parse(sesiStr);
      if (sesi.role !== "admin") { alert("Halaman ini khusus Admin/Bendahara."); window.location.href = "Index.html"; return; }
      window.KGP_SESI = sesi;
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengajuan Pembayaran - KGP SMPN 1 Kaliwedi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 15px;
      color: #333;
    }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .top-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
    .home-btn { width: 36px; height: 36px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3); flex-shrink: 0; }
    .home-btn:hover { transform: scale(1.08); }
    .home-btn svg { width: 18px; height: 18px; fill: #fff; }
    .top-header h1 { font-size: 1.1rem; color: #333; font-weight: 700; }

    .status-bar { background: #f0f4ff; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; color: #555; border-left: 4px solid #667eea; }
    .status-bar.error { background: #ffebee; color: #c62828; border-left-color: #dc3545; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; border-left-color: #28a745; }

    .pengajuan-card {
      border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .pengajuan-info .nama { font-weight: 700; color: #1e3c72; font-size: 0.95rem; }
    .pengajuan-info .detail { font-size: 0.82rem; color: #666; margin-top: 2px; }
    .pengajuan-info .nominal { font-weight: 800; color: #2e7d32; font-size: 1rem; margin-top: 4px; }
    .pengajuan-aksi { display: flex; gap: 8px; }
    .btn-terima, .btn-tolak, .btn-pdf {
      border: none; border-radius: 8px; padding: 9px 16px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .btn-terima { background: #2e7d32; color: #fff; }
    .btn-terima:hover { background: #256428; }
    .btn-tolak { background: #ffebee; color: #c62828; }
    .btn-tolak:hover { background: #ffcdd2; }
    .btn-pdf { background: #1e3c72; color: #fff; }
    .btn-pdf:hover { background: #2a5298; }
    .kosong { text-align: center; padding: 40px 20px; color: #999; font-size: 0.9rem; }
    .badge-disetujui { background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-header">
      <a href="Index.html" class="home-btn" title="Beranda">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </a>
      <h1>PENGAJUAN PEMBAYARAN</h1>
    </div>

    <div id="statusBar" class="status-bar">🔄 Memuat data...</div>

    <div id="daftarPengajuan"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';
    const GITHUB_BASE = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/';
    const ANGGOTA_URL = GITHUB_BASE + 'anggota.csv';

    let dataAnggota = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(v => v.replace(/^"|"$/g, '').trim());
    }
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length === 0) return [];
      const headers = parseCSVLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }
    function formatRp(n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }

    async function muatDaftarPengajuan() {
      const statusBar = document.getElementById('statusBar');
      try {
        const [rA, rP] = await Promise.all([
          fetch(ANGGOTA_URL + '?t=' + Date.now()),
          fetch(SCRIPT_URL + '?action=daftarPengajuan')
        ]);
        dataAnggota = parseCSV(await rA.text()).filter(a => a.NOID && a.NOID.toUpperCase() !== 'NOID');
        const json = await rP.json();
        if (!json.success) throw new Error(json.error || 'Gagal memuat pengajuan');

        renderDaftar(json.data || []);
        statusBar.textContent = `✅ ${json.data.length} pengajuan menunggu`;
        statusBar.className = 'status-bar success';
      } catch (e) {
        console.error(e);
        statusBar.textContent = '❌ Gagal memuat data pengajuan.';
        statusBar.className = 'status-bar error';
      }
    }

    function renderDaftar(list) {
      const el = document.getElementById('daftarPengajuan');
      if (list.length === 0) {
        el.innerHTML = '<div class="kosong">Tidak ada pengajuan pembayaran yang menunggu saat ini.</div>';
        return;
      }
      el.innerHTML = list.map(p => `
        <div class="pengajuan-card" id="kartu-${p.baris}">
          <div class="pengajuan-info">
            <div class="nama">${p.nama} <span style="color:#999; font-weight:400;">(${p.noid})</span></div>
            <div class="detail">${p.jenisLabel} · Diajukan ${p.timestamp}</div>
            <div class="nominal">${formatRp(p.nominal)}</div>
          </div>
          <div class="pengajuan-aksi" id="aksi-${p.baris}">
            <button class="btn-terima" onclick="terimaPengajuan(${p.baris})">✅ Terima</button>
            <button class="btn-tolak" onclick="tolakPengajuanBaris(${p.baris})">❌ Tolak</button>
          </div>
        </div>
      `).join('');
      window.__daftarPengajuanTerkini = list;
    }

    async function terimaPengajuan(baris) {
      if (!confirm('Setujui pengajuan ini? Transaksi akan otomatis tercatat.')) return;
      const aksiEl = document.getElementById('aksi-' + baris);
      aksiEl.innerHTML = '<span style="color:#999; font-size:0.8rem;">Memproses...</span>';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'setujuiPengajuan', baris })
        });

        const p = (window.__daftarPengajuanTerkini || []).find(x => x.baris === baris);
        aksiEl.innerHTML = '<span class="badge-disetujui">✅ Disetujui</span> <button class="btn-pdf" onclick="unduhBuktiPembayaran(' + baris + ')">📄 Unduh Bukti (PDF)</button>';

        setTimeout(() => muatDaftarPengajuan(), 4000);
      } catch (err) {
        console.error(err);
        alert('Gagal memproses. Coba lagi.');
        muatDaftarPengajuan();
      }
    }

    async function tolakPengajuanBaris(baris) {
      if (!confirm('Tolak pengajuan ini? Tidak akan ada transaksi yang tercatat.')) return;
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'tolakPengajuan', baris })
        });
        document.getElementById('kartu-' + baris).remove();
      } catch (err) {
        console.error(err);
        alert('Gagal memproses. Coba lagi.');
      }
    }

    function unduhBuktiPembayaran(baris) {
      const p = (window.__daftarPengajuanTerkini || []).find(x => x.baris === baris);
      if (!p) { alert('Data pengajuan tidak ditemukan lagi, coba muat ulang halaman.'); return; }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: [105, 148] }); // ukuran kartu A6

      doc.setFontSize(11);
      doc.setFont(undefined, 'bold');
      doc.text('SMP NEGERI 1 KALIWEDI', 52.5, 15, { align: 'center' });
      doc.setFontSize(13);
      doc.text('BUKTI PEMBAYARAN KGP', 52.5, 22, { align: 'center' });
      doc.setLineWidth(0.3);
      doc.line(10, 26, 95, 26);

      doc.setFontSize(10);
      doc.setFont(undefined, 'normal');
      let y = 36;
      const baris2 = (label, isi) => { doc.setFont(undefined, 'bold'); doc.text(label, 10, y); doc.setFont(undefined, 'normal'); doc.text(String(isi), 45, y); y += 8; };

      baris2('Nama', p.nama);
      baris2('NOID', p.noid);
      baris2('Keterangan', p.jenisLabel);
      baris2('Nominal', formatRp(p.nominal));
      baris2('Tanggal Bayar', new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));

      y += 4;
      doc.setLineWidth(0.2);
      doc.line(10, y, 95, y);
      y += 8;
      doc.setFont(undefined, 'bold');
      doc.setFontSize(11);
      doc.text('STATUS: LUNAS / DIBAYAR', 52.5, y, { align: 'center' });

      y += 14;
      doc.setFont(undefined, 'normal');
      doc.setFontSize(8);
      doc.text('Dokumen ini dicetak otomatis oleh sistem KGP', 52.5, y, { align: 'center' });
      doc.text('sebagai bukti sah pembayaran telah diterima.', 52.5, y + 4, { align: 'center' });

      doc.save(`bukti_pembayaran_${p.noid}_${Date.now()}.pdf`);
    }

    muatDaftarPengajuan();
  </script>
</body>
</html>
