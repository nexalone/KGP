<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartu Anggota - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; font-size: 1.4rem; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 0.9rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error { background: #ffebee; color: #c62828; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e3c72; }
    .form-group select {
      width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
    }

    /* KARTU */
    #kartu {
      display: none;
      border: 3px solid #1e3c72;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 10px;
    }
    .kartu-header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      padding: 20px 25px;
    }
    .kartu-header .sekolah { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
    .kartu-header .judul { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    .kartu-body { padding: 25px; }
    .kartu-identitas {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px dashed #ddd;
    }
    .kartu-identitas .nama { font-size: 1.3rem; font-weight: 700; color: #1e3c72; }
    .kartu-identitas .jabatan { color: #666; font-size: 0.9rem; margin-top: 2px; }
    .kartu-identitas .noid {
      background: #1e3c72; color: #fff; padding: 6px 14px; border-radius: 20px;
      font-weight: 700; font-size: 0.95rem; letter-spacing: 1px;
    }
    .simpanan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .simpanan-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .simpanan-item .label { font-size: 0.75rem; color: #666; font-weight: 600; margin-bottom: 6px; }
    .simpanan-item .nilai { font-size: 1rem; font-weight: 700; color: #1e3c72; }
    .pinjaman-section h4 {
      color: #1e3c72; font-size: 0.95rem; margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .pinjaman-card {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .pinjaman-card .baris { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .pinjaman-card .baris span:first-child { color: #666; }
    .pinjaman-card .baris span:last-child { font-weight: 600; color: #e65100; }
    .pinjaman-kosong { color: #999; font-size: 0.85rem; font-style: italic; padding: 10px 0; }
    .kartu-footer {
      background: #f8f9fa;
      padding: 12px 25px;
      text-align: center;
      font-size: 0.75rem;
      color: #999;
    }

    .btn {
      padding: 12px 24px; border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-right: 10px; margin-top: 15px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }

    @media print {
      body { background: #fff; padding: 0; }
      .nav-back, .form-group, .status-bar, .btn { display: none !important; }
      .container { box-shadow: none; max-width: 100%; padding: 0; }
      #kartu { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>KARTU ANGGOTA KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    <div id="statusBar" class="status-bar">🔄 Memuat data...</div>

    <div class="form-group">
      <label for="pilihAnggota">Pilih Anggota</label>
      <select id="pilihAnggota"><option value="">-- Pilih Anggota --</option></select>
    </div>

    <div id="kartu">
      <div class="kartu-header">
        <div class="sekolah">SMP NEGERI 1 KALIWEDI</div>
        <div class="judul">KARTU ANGGOTA KGP</div>
      </div>
      <div class="kartu-body">
        <div class="kartu-identitas">
          <div>
            <div class="nama" id="kNama">-</div>
            <div class="jabatan" id="kJabatan">-</div>
          </div>
          <div class="noid" id="kNoid">-</div>
        </div>

        <div class="simpanan-grid">
          <div class="simpanan-item">
            <div class="label">SIMPANAN POKOK</div>
            <div class="nilai" id="kSP">Rp 0</div>
          </div>
          <div class="simpanan-item">
            <div class="label">SIMPANAN WAJIB</div>
            <div class="nilai" id="kSW">Rp 0</div>
          </div>
          <div class="simpanan-item">
            <div class="label">SIMPANAN HARI RAYA</div>
            <div class="nilai" id="kSHR">Rp 0</div>
          </div>
        </div>

        <div class="pinjaman-section">
          <h4>💳 Sisa Pinjaman Aktif</h4>
          <div id="kPinjaman"></div>
        </div>
      </div>
      <div class="kartu-footer">
        Dicetak otomatis dari sistem KGP · <span id="kTanggalCetak"></span>
      </div>
    </div>

    <button class="btn btn-primary" id="btnCetak" onclick="window.print()" style="display:none;">🖨️ Cetak / Simpan PDF</button>
  </div>

  <script>
    const GITHUB_BASE = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/';
    const ANGGOTA_URL = GITHUB_BASE + 'anggota.csv';
    const TRANSAKSI_URL = GITHUB_BASE + 'transaksi.csv';

    let dataAnggota = [], dataTransaksi = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (inQuotes && line[i+1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += c;
      }
      result.push(current);
      return result.map(v => v.replace(/^"|"$/g, '').trim());
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length === 0) return [];
      const headers = parseCSVLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }

    function formatRp(n) {
      return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
    }

    async function loadAllData() {
      const statusBar = document.getElementById('statusBar');
      try {
        const [rA, rT] = await Promise.all([
          fetch(ANGGOTA_URL + '?t=' + Date.now()),
          fetch(TRANSAKSI_URL + '?t=' + Date.now())
        ]);
        if (!rA.ok || !rT.ok) throw new Error('Gagal mengambil data dari GitHub');
        const [txtA, txtT] = await Promise.all([rA.text(), rT.text()]);

        dataAnggota = parseCSV(txtA);
        dataTransaksi = parseCSV(txtT);

        populateDropdown();
        statusBar.textContent = `✅ ${dataAnggota.length} anggota dimuat`;
        statusBar.className = 'status-bar success';
      } catch (e) {
        console.error(e);
        statusBar.textContent = '❌ Gagal memuat data dari GitHub.';
        statusBar.className = 'status-bar error';
      }
    }

    function populateDropdown() {
      const sel = document.getElementById('pilihAnggota');
      sel.innerHTML = '<option value="">-- Pilih Anggota --</option>';
      dataAnggota
        .filter(a => (a.STATUS || '').toUpperCase() === 'AKTIF')
        .forEach(a => { sel.innerHTML += `<option value="${a.NOID}">${a.NOID} - ${a.NAMA}</option>`; });
    }

    // Hitung total SP, SW, SHR (net setor-tarik), dan daftar pinjaman aktif untuk satu NOID
    function hitungRingkasan(noid) {
      const punya = dataTransaksi.filter(t => t.NOID === noid);

      let sp = 0, sw = 0, shrSetor = 0, shrTarik = 0;
      punya.forEach(t => {
        const ref = t.REF || '';
        const masuk = Number(t.MASUK) || 0;
        const keluar = Number(t.KELUAR) || 0;

        if (ref === '1') sp += masuk;                              // SP: ref persis "1"
        else if (/^\d{4}-2$/.test(ref)) sw += masuk;                // SW: YYMM-2
        else if (/^\d{4}-3$/.test(ref)) shrSetor += masuk;          // SHR Setor: YYMM-3
        else if (/^\d{4}-11$/.test(ref)) shrTarik += keluar;        // SHR Tarik: YYYY-11
      });

      // Pinjaman aktif: cari semua slot PJM(4) & SMT(5) yang pokoknya belum lunas
      const pinjamanAktif = [];
      ['4', '5'].forEach(jenisDigit => {
        for (let slot = 1; slot <= 5; slot++) {
          const info = getInfoPinjamanLokal(punya, jenisDigit, slot);
          if (info && info.pokokTerbayar < info.pokokAwal) {
            pinjamanAktif.push({
              jenis: jenisDigit === '4' ? 'Pinjaman (Kredit)' : 'Pinjaman Sementara',
              pokokAwal: info.pokokAwal,
              sisaPokok: info.pokokAwal - info.pokokTerbayar,
              jmlCicilan: info.jmlCicilan,
              angsuranKe: info.angsuranTerbayar
            });
          }
        }
      });

      return { sp, sw, shr: shrSetor - shrTarik, pinjamanAktif };
    }

    // Versi ringan dari logika getInfoPinjaman di Code.gs, dijalankan di browser
    function getInfoPinjamanLokal(rows, jenisDigit, slot) {
      let pokokAwal = 0, jmlCicilan = 0, tglCair = null, found = false;
      const cicilanDigit = jenisDigit === '4' ? '6' : '7';

      rows.forEach(t => {
        const parts = (t.REF || '').split('-');
        if (parts.length === 3 && parts[1] === jenisDigit && parts[2] === String(slot)) {
          const tgl = new Date(t['TIME STAMP']);
          if (!tglCair || tgl > tglCair) {
            tglCair = tgl;
            pokokAwal = Number(t.KELUAR) || 0;
            jmlCicilan = Number(t['JML CICILAN']) || 0;
            found = true;
          }
        }
      });
      if (!found) return null;

      let pokokTerbayar = 0, angsuranTerbayar = 0;
      rows.forEach(t => {
        const parts = (t.REF || '').split('-');
        if (parts.length === 4 && parts[1] === cicilanDigit && parts[2] === String(slot)) {
          const tgl = new Date(t['TIME STAMP']);
          if (tgl >= tglCair) {
            pokokTerbayar += Number(t.MASUK) || 0;
            angsuranTerbayar++;
          }
        }
      });

      return { pokokAwal, jmlCicilan, pokokTerbayar, angsuranTerbayar };
    }

    function tampilkanKartu(noid) {
      const anggota = dataAnggota.find(a => a.NOID === noid);
      if (!anggota) return;

      const ringkasan = hitungRingkasan(noid);

      document.getElementById('kNama').textContent = anggota.NAMA;
      document.getElementById('kJabatan').textContent = anggota.JABATAN || '-';
      document.getElementById('kNoid').textContent = anggota.NOID;
      document.getElementById('kSP').textContent = formatRp(ringkasan.sp);
      document.getElementById('kSW').textContent = formatRp(ringkasan.sw);
      document.getElementById('kSHR').textContent = formatRp(ringkasan.shr);

      const pinjamanEl = document.getElementById('kPinjaman');
      if (ringkasan.pinjamanAktif.length === 0) {
        pinjamanEl.innerHTML = '<div class="pinjaman-kosong">Tidak ada pinjaman aktif</div>';
      } else {
        pinjamanEl.innerHTML = ringkasan.pinjamanAktif.map(p => `
          <div class="pinjaman-card">
            <div class="baris"><span>${p.jenis}</span><span></span></div>
            <div class="baris"><span>Pinjaman Awal</span><span>${formatRp(p.pokokAwal)}</span></div>
            <div class="baris"><span>Sisa Pinjaman</span><span>${formatRp(p.sisaPokok)}</span></div>
            <div class="baris"><span>Jumlah Angsuran</span><span>${p.angsuranKe} dari ${p.jmlCicilan || '-'}</span></div>
          </div>
        `).join('');
      }

      document.getElementById('kTanggalCetak').textContent = new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
      document.getElementById('kartu').style.display = 'block';
      document.getElementById('btnCetak').style.display = 'inline-block';
    }

    document.getElementById('pilihAnggota').addEventListener('change', function() {
      if (this.value) tampilkanKartu(this.value);
      else {
        document.getElementById('kartu').style.display = 'none';
        document.getElementById('btnCetak').style.display = 'none';
      }
    });

    loadAllData();
  </script>
</body>
</html>
