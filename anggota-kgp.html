<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Anggota - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      position: relative; /* Untuk posisi badge */
    }
    
    /* Badge Kode di Pojok Kanan Atas */
    .kode-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ffc107, #ff9800);
      color: #333;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .kode-badge span { font-size: 0.8rem; font-weight: 600; opacity: 0.8; }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error { background: #ffebee; color: #c62828; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input[readonly] {
      background: #f0f4f8;
      color: #1e3c72;
      font-weight: bold;
      cursor: not-allowed;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }
    
    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: #1e3c72; color: #fff; }
    tr:hover { background: #f8f9fa; }
    
    .loading {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .kode-badge { top: 10px; right: 10px; font-size: 0.9rem; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Badge Kode di Pojok Kanan Atas -->
    <div class="kode-badge" id="kodeBadge">
      <span>KODE BARU:</span> <span id="displayKode">-</span>
    </div>

    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>DATA ANGGOTA KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    
    <div id="statusBar" class="status-bar">🔄 Memuat data dari Google Sheets...</div>
    
    <h3 style="margin-bottom: 20px; color: #1e3c72;"> Tambah Anggota Baru</h3>
    <form id="formAnggota">
      <div class="form-grid">
        <div class="form-group">
          <label for="kode">Kode Anggota (Otomatis)</label>
          <input type="text" id="kode" readonly required />
        </div>
        <div class="form-group">
          <label for="nama">Nama Lengkap *</label>
          <input type="text" id="nama" placeholder="Nama lengkap dengan gelar" required />
        </div>
        <div class="form-group">
          <label for="tanggal">Tanggal Daftar *</label>
          <input type="date" id="tanggal" required />
        </div>
        <div class="form-group">
          <label for="jabatan">Jabatan *</label>
          <select id="jabatan" required>
            <option value="Anggota">Anggota</option>
            <option value="Penasehat">Penasehat</option>
            <option value="Ketua">Ketua</option>
            <option value="Sekretaris">Sekretaris</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Pengurus">Pengurus</option>
            <option value="Badan Pemeriksa">Badan Pemeriksa</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnSubmit">💾 Simpan ke Google Sheets</button>
      <button type="button" class="btn btn-secondary" onclick="resetForm()"> Reset Form</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #1e3c72;">👥 Daftar Anggota KGP (<span id="jumlahAnggota">0</span>)</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Kode</th><th>Nama</th><th>Tanggal Daftar</th><th>Jabatan</th></tr>
        </thead>
        <tbody id="tabelAnggota">
          <tr><td colspan="4" style="text-align:center;padding:20px;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '151XT0NLPb7fljwUOe_PP3dhD_-dPhBmA_jrffxGZWjQ';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';
    const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
    
    let dataAnggota = [];

    // 1. Parser CSV yang lebih robust (mengatasi tanda kutip & format Google Sheets)
    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(current); current = '';
        } else { current += c; }
      }
      result.push(current);
      return result;
    }

    // 2. Generate Kode Otomatis [YY][MM][XXX]
    function generateKode() {
      const now = new Date();
      const YY = now.getFullYear().toString().substr(-2);
      const MM = (now.getMonth() + 1).toString().padStart(2, '0');
      const prefix = YY + MM;

      // Hitung berapa anggota yang sudah ada dengan prefix bulan ini
      const count = dataAnggota.filter(a => a.KODE && a.KODE.startsWith(prefix)).length;
      const XXX = (count + 1).toString().padStart(3, '0');

      return prefix + XXX;
    }

    // 3. Load Data & Fix Bug Tabel Kosong
    async function loadAnggota() {
      const statusBar = document.getElementById('statusBar');
      try {
        const response = await fetch(SHEET1_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Gagal mengambil data');
        
        const text = await response.text();
        const lines = text.trim().split('\n');
        dataAnggota = [];

        // Cari baris header secara dinamis (yang mengandung kata 'KODE')
        let headerIndex = -1;
        for(let i=0; i<lines.length; i++) {
          if(lines[i].toUpperCase().includes('KODE')) {
            headerIndex = i;
            break;
          }
        }
        if(headerIndex === -1) headerIndex = 1; // Fallback

        // Parse data mulai dari baris setelah header
        for (let i = headerIndex + 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const values = parseCSVLine(lines[i]);
          
          // Mapping berdasarkan INDEX KOLOM (lebih aman daripada nama header)
          // Sheet1: Col 0=KODE, Col 1=NAMA, Col 2=TANGGAL DAFTAR, Col 3=JABATAN
          const obj = {
            KODE: (values[0] || '').replace(/"/g, '').trim(),
            NAMA: (values[1] || '').replace(/"/g, '').trim(),
            'TANGGAL DAFTAR': (values[2] || '').replace(/"/g, '').trim(),
            JABATAN: (values[3] || '').replace(/"/g, '').trim()
          };
          
          if(obj.KODE) dataAnggota.push(obj);
        }

        statusBar.textContent = `✅ Data berhasil dimuat: ${dataAnggota.length} anggota`;
        statusBar.className = 'status-bar success';
        
        // Generate kode baru setelah data dimuat
        const newKode = generateKode();
        document.getElementById('kode').value = newKode;
        document.getElementById('displayKode').textContent = newKode;
        
        renderTabel();
      } catch (e) {
        console.error(e);
        statusBar.textContent = '❌ Gagal memuat data. Periksa koneksi atau ID Spreadsheet.';
        statusBar.className = 'status-bar error';
      }
    }

    // 4. Render Tabel (Diperbaiki)
    function renderTabel() {
      const tbody = document.getElementById('tabelAnggota');
      document.getElementById('jumlahAnggota').textContent = dataAnggota.length;
      
      if (dataAnggota.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">Belum ada data</td></tr>';
        return;
      }
      
      // Render baris tabel
      tbody.innerHTML = dataAnggota.map(a => `
        <tr>
          <td><strong>${a.KODE}</strong></td>
          <td>${a.NAMA}</td>
          <td>${a['TANGGAL DAFTAR']}</td>
          <td>${a.JABATAN}</td>
        </tr>
      `).join('');
    }

    // 5. Submit Form
    document.getElementById('formAnggota').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const btnSubmit = document.getElementById('btnSubmit');
      const originalText = btnSubmit.innerHTML;
      
      btnSubmit.innerHTML = '<span class="loading"></span> Menyimpan...';
      btnSubmit.disabled = true;

      const data = {
        sheet: 'Sheet1',
        kode: document.getElementById('kode').value,
        nama: document.getElementById('nama').value,
        tanggal: document.getElementById('tanggal').value,
        jabatan: document.getElementById('jabatan').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        statusBar.textContent = '✅ Anggota berhasil ditambahkan ke Google Sheets!';
        statusBar.className = 'status-bar success';
        this.reset();
        document.getElementById('tanggal').valueAsDate = new Date();
        await loadAnggota(); // Reload untuk update tabel & generate kode berikutnya
      } catch (err) {
        statusBar.textContent = '❌ Gagal menyimpan. Coba lagi.';
        statusBar.className = 'status-bar error';
      } finally {
        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;
      }
    });

    function resetForm() {
      document.getElementById('formAnggota').reset();
      document.getElementById('tanggal').valueAsDate = new Date();
      // Regenerate kode saat reset
      document.getElementById('kode').value = generateKode();
      document.getElementById('displayKode').textContent = generateKode();
    }

    // Inisialisasi
    document.getElementById('tanggal').valueAsDate = new Date();
    loadAnggota();
  </script>
</body>
</html>
