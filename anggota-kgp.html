  <script>
    const GITHUB_BASE = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/';
    const ANGGOTA_URL = GITHUB_BASE + 'anggota.csv';
    const TRANSAKSI_URL = GITHUB_BASE + 'transaksi.csv';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';

    let dataAnggota = [], dataTransaksi = [];

    // Parser CSV yang lebih robust untuk file CSV biasa
    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(current); current = '';
        } else { current += c; }
      }
      result.push(current);
      return result.map(v => v.replace(/^"|"$/g, '').trim());
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length === 0) return [];
      const headers = parseCSVLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h.trim()] = values[idx] || ''; });
        result.push(obj);
      }
      return result;
    }

    // Ubah format tanggal dari yyyy-MM-dd (atau format lain yang bisa dibaca Date) menjadi D-MMM-YYYY
    function formatTanggal(tgl) {
      if (!tgl) return '-';
      const d = new Date(tgl);
      if (isNaN(d.getTime())) return tgl; // kalau gagal parse, tampilkan apa adanya
      const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return d.getDate() + '-' + bulan[d.getMonth()] + '-' + d.getFullYear();
    }

    function formatRp(n) {
      return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
    }

    // Hitung total simpanan (SP+SW+SHR net) & total sisa pinjaman aktif untuk satu NOID
    function hitungRingkasan(noid) {
      const punya = dataTransaksi.filter(t => t.NOID === noid);
      let sp = 0, sw = 0, shrSetor = 0, shrTarik = 0;
      punya.forEach(t => {
        const ref = t.REF || '';
        const masuk = Number(t.MASUK) || 0;
        const keluar = Number(t.KELUAR) || 0;
        if (ref === 'SP') sp += masuk;
        else if (ref === 'SPT') sp -= keluar;
        else if (/^SW-\d{4}$/.test(ref)) sw += masuk;
        else if (ref === 'SWT') sw -= keluar;
        else if (/^SHR-\d{4}$/.test(ref)) shrSetor += masuk;
        else if (ref === 'SHRT') shrTarik += keluar;
      });

      let sisaPinjaman = 0;
      ['K', 'KS'].forEach(jenisPrefix => {
        for (let slot = 1; slot <= 5; slot++) {
          const info = getInfoPinjamanLokal(punya, jenisPrefix, slot);
          if (info && info.pokokTerbayar < info.pokokAwal) {
            sisaPinjaman += (info.pokokAwal - info.pokokTerbayar);
          }
        }
      });

      return { jmlSimp: sp + sw + (shrSetor - shrTarik), shr: shrSetor - shrTarik, sisaPinjaman };
    }

    function getInfoPinjamanLokal(rows, jenisPrefix, slot) {
      let pokokAwal = 0, tglCair = null, found = false;
      const cicilanPrefix = jenisPrefix === 'K' ? 'CP' : 'CS';

      rows.forEach(t => {
        const parts = (t.REF || '').split('-');
        if (parts.length === 3 && parts[0] === jenisPrefix && parts[2] === String(slot)) {
          const tgl = new Date(t['TIME STAMP']);
          if (!tglCair || tgl > tglCair) {
            tglCair = tgl;
            pokokAwal = Number(t.KELUAR) || 0;
            found = true;
          }
        }
      });
      if (!found) return null;

      let pokokTerbayar = 0;
      rows.forEach(t => {
        const parts = (t.REF || '').split('-');
        if (parts.length === 4 && parts[0] === cicilanPrefix && parts[2] === String(slot)) {
          const tgl = new Date(t['TIME STAMP']);
          if (tgl >= tglCair) pokokTerbayar += Number(t.MASUK) || 0;
        }
      });

      return { pokokAwal, pokokTerbayar };
    }

    async function loadAnggota() {
      const statusBar = document.getElementById('statusBar');
      try {
        const [rA, rT] = await Promise.all([
          fetch(ANGGOTA_URL + '?t=' + Date.now()),
          fetch(TRANSAKSI_URL + '?t=' + Date.now())
        ]);
        if (!rA.ok || !rT.ok) throw new Error('Gagal mengambil data');
        const [txtA, txtT] = await Promise.all([rA.text(), rT.text()]);

        dataAnggota = parseCSV(txtA);
        dataTransaksi = parseCSV(txtT);

        const aktif = dataAnggota.filter(a => (a.STATUS || '').toUpperCase() === 'AKTIF');
        statusBar.textContent = `✅ ${aktif.length} anggota dari GitHub`;
        statusBar.className = 'status-bar success';

        renderTabelAktif();
      } catch (e) {
        console.error(e);
        statusBar.textContent = '❌ Gagal mengambil data dari GitHub';
        statusBar.className = 'status-bar error';
      }
    }

    let filterTabelUtama = 'aktif'; // 'aktif' | 'semua'

    function setFilterTabel(mode) {
      filterTabelUtama = mode;
      document.getElementById('btnFilterTabelAktif').classList.toggle('active', mode === 'aktif');
      document.getElementById('btnFilterTabelSemua').classList.toggle('active', mode === 'semua');
      renderTabelAktif();
    }

    function renderTabelAktif() {
      const tbody = document.getElementById('tabelAktif');
      const daftar = dataAnggota
        .filter(a => filterTabelUtama === 'semua' || (a.STATUS || '').toUpperCase() === 'AKTIF')
        .sort((a, b) => (a.NAMA || '').localeCompare(b.NAMA || '', 'id'));
      document.getElementById('jumlahAnggota').textContent = daftar.length;
      if (daftar.length === 0) {
        tbody.innerHTML = '<tr><td style="text-align:center;padding:20px;color:#999;">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = daftar.map(a => {
        const r = hitungRingkasan(a.NOID);
        const statusA = (a.STATUS || '').toUpperCase();
        let badge = '';
        if (statusA === 'PASIF') badge = ' <span class="saran-badge pasif" style="margin-left:4px;">Pasif</span>';
        else if (statusA !== 'AKTIF') badge = ' <span class="saran-badge nonaktif" style="margin-left:4px;">Tidak Aktif</span>';
        return `
        <tr>
          <td>
            <a class="nama-link" href="transaksi-kgp.html?noid=${encodeURIComponent(a.NOID)}">
              <div class="member-name">${a.NAMA}${badge}</div>
            </a>
            <div class="sub-info">
              <span><span class="label">NOID:</span> ${a.NOID}</span>
              <span><span class="label">SHR:</span> ${formatRp(r.shr)}</span>
              <span class="${r.sisaPinjaman > 0 ? 'pinjaman-ada' : ''}"><span class="label">Sisa Pinjaman:</span> ${formatRp(r.sisaPinjaman)}</span>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    // ===== FILTER & PENCARIAN BERSARAN UNTUK MODAL KELOLA =====
    let filterAnggotaModal = 'aktif'; // 'aktif' | 'semua'

    function setFilterAnggota(mode) {
      filterAnggotaModal = mode;
      document.getElementById('btnFilterAktif').classList.toggle('active', mode === 'aktif');
      document.getElementById('btnFilterSemua').classList.toggle('active', mode === 'semua');
      // Reset pilihan yang sedang aktif kalau filter diganti
      document.getElementById('cariAnggota').value = '';
      document.getElementById('editAnggota').value = '';
      document.getElementById('saranAnggota').innerHTML = '';
      document.getElementById('saranAnggota').style.display = 'none';
    }

    function daftarAnggotaTerfilter() {
      return dataAnggota
        .map((a, idx) => ({ ...a, _idx: idx }))
        .filter(a => filterAnggotaModal === 'semua' || (a.STATUS || '').toUpperCase() === 'AKTIF')
        .sort((a, b) => (a.NAMA || '').localeCompare(b.NAMA || '', 'id'));
    }

    function tampilkanSaranAnggota(kataKunci) {
      const kotak = document.getElementById('saranAnggota');
      const kw = kataKunci.trim().toLowerCase();
      if (!kw) { kotak.innerHTML = ''; kotak.style.display = 'none'; return; }

      const hasil = daftarAnggotaTerfilter()
        .filter(a => (a.NAMA || '').toLowerCase().includes(kw) || (a.NOID || '').toLowerCase().includes(kw))
        .slice(0, 8);

      if (hasil.length === 0) {
        kotak.innerHTML = '<div class="saran-kosong">Tidak ditemukan</div>';
        kotak.style.display = 'block';
        return;
      }
      kotak.innerHTML = hasil.map(a => {
        const statusA = (a.STATUS || '').toUpperCase();
        const kelas = statusA === 'AKTIF' ? 'aktif' : statusA === 'PASIF' ? 'pasif' : 'nonaktif';
        const label = statusA === 'AKTIF' ? 'Aktif' : statusA === 'PASIF' ? 'Pasif' : 'Tidak Aktif';
        return `
        <div class="saran-item" onclick="pilihAnggotaSaran(${a._idx})">
          <span>${a.NAMA} <span class="saran-noid">(${a.NOID})</span></span>
          <span class="saran-badge ${kelas}">${label}</span>
        </div>`;
      }).join('');
      kotak.style.display = 'block';
    }

    function pilihAnggotaSaran(idx) {
      const a = dataAnggota[idx];
      if (!a) return;
      document.getElementById('cariAnggota').value = `${a.NAMA} (${a.NOID})`;
      document.getElementById('editAnggota').value = idx;
      document.getElementById('saranAnggota').innerHTML = '';
      document.getElementById('saranAnggota').style.display = 'none';
      loadKelolaData();
    }

    document.getElementById('cariAnggota').addEventListener('input', function() {
      document.getElementById('editAnggota').value = ''; // pilihan lama batal kalau user ketik ulang
      tampilkanSaranAnggota(this.value);
    });
    document.getElementById('cariAnggota').addEventListener('focus', function() {
      if (this.value.trim()) tampilkanSaranAnggota(this.value);
    });
    document.getElementById('cariAnggota').addEventListener('blur', function() {
      setTimeout(() => { document.getElementById('saranAnggota').style.display = 'none'; }, 150);
    });

    function toggleForm() {
      const form = document.getElementById('formContainer');
      form.classList.toggle('show');
      if (form.classList.contains('show')) {
        document.getElementById('formAnggota').reset();
        window.scrollTo({ top: 150, behavior: 'smooth' });
      }
    }

    document.getElementById('formAnggota').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const btnSubmit = document.getElementById('btnSubmit');
      const originalText = btnSubmit.innerHTML;
      
      btnSubmit.innerHTML = '<span class="loading"></span> Menyimpan...';
      btnSubmit.disabled = true;

      const data = {
        action: 'tambahAnggota',
        nama: document.getElementById('nama').value,
        tanggal: new Date().toISOString().split('T')[0],
        jabatan: document.getElementById('jabatan').value,
        nominalShr: document.getElementById('nominalShr') ? (document.getElementById('nominalShr').value || 0) : 0
      };

      try {
        await fetch(SCRIPT_URL, { 
          method: 'POST', 
          mode: 'no-cors', 
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data) 
        });

        // Update tampilan langsung (NOID final baru diketahui setelah reload dari GitHub)
        dataAnggota.push({
          NOID: '(diproses...)',
          NAMA: data.nama,
          'TANGGAL DAFTAR': data.tanggal,
          JABATAN: data.jabatan,
          STATUS: 'AKTIF',
          'TANGGAL KELUAR': '',
          ALASAN: '',
          'NOMINAL SHR': data.nominalShr
        });
        renderTabelAktif();

        statusBar.textContent = '✅ Anggota berhasil ditambahkan!';
        statusBar.className = 'status-bar success';
        this.reset();
        document.getElementById('formContainer').classList.remove('show');
        setTimeout(() => loadAnggota(), 4000);
      } catch (err) {
        statusBar.textContent = '❌ Gagal menyimpan.';
        statusBar.className = 'status-bar error';
      } finally {
        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;
      }
    });

    function toggleFieldKeluar() {
      const status = document.getElementById('editStatus').value;
      const tampilkan = status === 'Tidak Aktif' || status === 'Pasif';
      document.getElementById('groupTanggalKeluar').style.display = tampilkan ? 'block' : 'none';
      document.getElementById('groupAlasan').style.display = tampilkan ? 'block' : 'none';
    }

    function openModal() {
      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('formKelola').reset();
      document.getElementById('groupTanggalKeluar').style.display = 'none';
      document.getElementById('groupAlasan').style.display = 'none';
      document.getElementById('editAnggota').value = '';
      document.getElementById('cariAnggota').value = '';
      document.getElementById('saranAnggota').innerHTML = '';
      document.getElementById('saranAnggota').style.display = 'none';
      setFilterAnggota('aktif');
      document.getElementById('editStatus').value = 'Aktif';
      document.getElementById('editTanggalKeluar').value = '';
      document.getElementById('editAlasan').value = '';
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    async function loadKelolaData() {
      const idx = document.getElementById('editAnggota').value;
      if (!idx) return;
      const anggota = dataAnggota[idx];
      if (!anggota) return;

      const statusData = anggota.STATUS.toUpperCase();
      document.getElementById('editStatus').value = statusData === 'AKTIF' ? 'Aktif' : statusData === 'PASIF' ? 'Pasif' : 'Tidak Aktif';
      // Cocokkan jabatan tanpa peduli besar/kecil huruf (data lama mungkin beda kapitalisasi)
      const selJabatan = document.getElementById('editJabatan');
      const jabatanData = (anggota.JABATAN || 'Anggota').trim();
      const opsiCocok = Array.from(selJabatan.options).find(o => o.value.toLowerCase() === jabatanData.toLowerCase());
      selJabatan.value = opsiCocok ? opsiCocok.value : 'Anggota';
      document.getElementById('editAlasan').value = anggota.ALASAN || '';
      document.getElementById('editNominalShr').value = anggota['NOMINAL SHR'] || '';
      toggleFieldKeluar();

      if ((statusData === 'TIDAK AKTIF' || statusData === 'PASIF') && anggota['TANGGAL KELUAR']) {
        document.getElementById('editTanggalKeluar').value = anggota['TANGGAL KELUAR'];
      } else {
        document.getElementById('editTanggalKeluar').value = '';
      }
    }

    // Format otomatis pemisah ribuan untuk Nominal SHR
    document.getElementById('editNominalShr').addEventListener('input', function() {
      const angka = this.value.replace(/\D/g, '');
      this.value = angka ? Number(angka).toLocaleString('id-ID') : '';
    });

    document.getElementById('formKelola').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const idx = document.getElementById('editAnggota').value;
      if (idx === '') { alert('Pilih anggota terlebih dahulu!'); return; }
      
      const anggota = dataAnggota[idx];
      const status = document.getElementById('editStatus').value;
      const jabatan = document.getElementById('editJabatan').value;
      const tanggalKeluar = document.getElementById('editTanggalKeluar').value;
      const alasan = document.getElementById('editAlasan').value;
      const nominalShr = document.getElementById('editNominalShr').value.replace(/\D/g, '') || '0';

      if ((status === 'Tidak Aktif' || status === 'Pasif') && !tanggalKeluar) { alert('Tanggal keluar wajib diisi!'); return; }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'updateStatusAnggota',
            noid: anggota.NOID,
            status: status,
            jabatan: jabatan,
            tanggalKeluar: tanggalKeluar,
            alasan: alasan,
            nominalShr: nominalShr
          })
        });

        // Update tampilan langsung
        anggota.STATUS = status.toUpperCase();
        anggota.JABATAN = jabatan;
        anggota['TANGGAL KELUAR'] = tanggalKeluar;
        anggota.ALASAN = alasan;
        anggota['NOMINAL SHR'] = nominalShr;
        renderTabelAktif();

        statusBar.textContent = '✅ Status berhasil diupdate!';
        statusBar.className = 'status-bar success';
        closeModal();
        setTimeout(() => loadAnggota(), 4000);
      } catch (err) {
        statusBar.textContent = '❌ Gagal update.';
        statusBar.className = 'status-bar error';
      }
    });

    // ===== EKSPOR EXCEL =====
    function downloadExcel(filename, headers, rows) {
      const data = [headers, ...rows];
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, filename.replace(/\.xls$/, '.xlsx'));
    }

    function unduhExcelAnggota() {
      const daftar = dataAnggota.filter(a => filterTabelUtama === 'semua' || (a.STATUS || '').toUpperCase() === 'AKTIF');
      const rows = daftar.map(a => {
        const r = hitungRingkasan(a.NOID);
        return [a.NOID, a.NAMA, a.JABATAN || '', a.STATUS || '', formatTanggal(a['TANGGAL DAFTAR']), r.jmlSimp, r.sisaPinjaman];
      });
      downloadExcel('data_anggota.xls', ['NOID', 'Nama', 'Jabatan', 'Status', 'Tanggal Daftar', 'Simpanan', 'Sisa Pinjaman'], rows);
    }

    loadAnggota();
  </script>
</body>
</html>
