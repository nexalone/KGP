<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Anggota - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error {
      background: #ffebee;
      color: #c62828;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #1e3c72;
      color: #fff;
    }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>DATA ANGGOTA KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    <div id="statusBar" class="status-bar">🔄 Memuat data...</div>
    <h3 style="margin-bottom: 20px; color: #1e3c72;">📝 Form Data Anggota</h3>
    <form id="formAnggota">
      <div class="form-grid">
        <div class="form-group">
          <label for="kode">Kode</label>
          <input type="text" id="kode" required />
        </div>
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" required />
        </div>
        <div class="form-group">
          <label for="tanggal">Tanggal Daftar</label>
          <input type="date" id="tanggal" required />
        </div>
        <div class="form-group">
          <label for="jabatan">Jabatan</label>
          <select id="jabatan" required>
            <option value="Anggota">Anggota</option>
            <option value="Penasehat">Penasehat</option>
            <option value="Ketua">Ketua</option>
            <option value="Sekretaris">Sekretaris</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Pengurus">Pengurus</option>
            <option value="Badan Pemeriksa">Badan Pemeriksa</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">💾 Simpan Data</button>
      <button type="button" class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
    </form>
    <h3 style="margin: 40px 0 20px; color: #1e3c72;">👥 Daftar Anggota KGP (<span id="jumlahAnggota">0</span>)</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Kode</th><th>Nama</th><th>Jabatan</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tabelAnggota"></tbody>
      </table>
    </div>
  </div>
  <script>
    const CSV_URL = 'https://raw.githubusercontent.com/nexalone/KGP/main/data/anggota.csv';
    let dataAnggota = [];

    async function loadAnggota() {
      const statusBar = document.getElementById('statusBar');
      try {
        const response = await fetch(CSV_URL + '?t=' + Date.now());
        if (!response.ok) throw new Error('Gagal');
        const text = await response.text();
        const lines = text.trim().split('\n');
        dataAnggota = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = lines[i].split(',');
          dataAnggota.push({
            KODE: cols[0]?.trim() || '',
            NAMA: cols[1]?.trim().replace(/"/g, '') || '',
            TANGGAL: cols[2]?.trim() || '',
            JABATAN: cols[3]?.trim() || ''
          });
        }
        statusBar.textContent = `✅ Data berhasil dimuat: ${dataAnggota.length} anggota`;
        renderTabel();
      } catch (e) {
        statusBar.textContent = ' Gagal memuat data. Pastikan file data/anggota.csv ada di GitHub.';
        statusBar.className = 'status-bar error';
      }
    }

    function renderTabel() {
      const tbody = document.getElementById('tabelAnggota');
      document.getElementById('jumlahAnggota').textContent = dataAnggota.length;
      if (dataAnggota.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = dataAnggota.map((a, i) => `
        <tr>
          <td>${a.KODE}</td>
          <td>${a.NAMA}</td>
          <td>${a.JABATAN}</td>
          <td><button class="btn btn-secondary" onclick="alert('Edit akan segera tersedia')">✏️ Edit</button></td>
        </tr>
      `).join('');
    }

    function resetForm() {
      document.getElementById('formAnggota').reset();
    }

    document.getElementById('formAnggota').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Fitur simpan akan segera tersedia. Untuk saat ini, edit langsung di Google Sheets atau file CSV.');
    });

    document.getElementById('tanggal').valueAsDate = new Date();
    loadAnggota();
  </script>
</body>
</html>
