<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Anggota - KGP SMPN 1 Kaliwedi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #1e3c72;
    }
    header h1 { color: #1e3c72; margin-bottom: 5px; }
    header h2 { color: #666; font-size: 1rem; font-weight: 400; }
    .nav-back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #1e3c72;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .nav-back:hover { background: #2a5298; }
    .status-bar {
      background: #e3f2fd;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #1565c0;
    }
    .status-bar.error { background: #ffebee; color: #c62828; }
    .status-bar.success { background: #e8f5e9; color: #2e7d32; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e3c72;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #1e3c72;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    .btn-primary { background: #1e3c72; color: #fff; }
    .btn-primary:hover { background: #2a5298; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-success:hover { background: #218838; }
    .table-responsive { overflow-x: auto; margin-top: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #1e3c72;
      color: #fff;
    }
    tr:hover { background: #f8f9fa; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="Index.html" class="nav-back">⬅ Kembali ke Beranda</a>
    <header>
      <h1>DATA ANGGOTA KGP</h1>
      <h2>Kesejahteraan Guru dan Karyawan - SMP Negeri 1 Kaliwedi</h2>
    </header>
    <div id="statusBar" class="status-bar">🔄 Memuat data dari Google Sheets...</div>
    
    <h3 style="margin-bottom: 20px; color: #1e3c72;">📝 Tambah Anggota Baru</h3>
    <form id="formAnggota">
      <div class="form-grid">
        <div class="form-group">
          <label for="kode">Kode Anggota *</label>
          <input type="text" id="kode" placeholder="Contoh: 2601015" required />
        </div>
        <div class="form-group">
          <label for="nama">Nama Lengkap *</label>
          <input type="text" id="nama" placeholder="Nama lengkap dengan gelar" required />
        </div>
        <div class="form-group">
          <label for="tanggal">Tanggal Daftar *</label>
          <input type="date" id="tanggal" required />
        </div>
        <div class="form-group">
          <label for="jabatan">Jabatan *</label>
          <select id="jabatan" required>
            <option value="Anggota">Anggota</option>
            <option value="Penasehat">Penasehat</option>
            <option value="Ketua">Ketua</option>
            <option value="Sekretaris">Sekretaris</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Pengurus">Pengurus</option>
            <option value="Badan Pemeriksa">Badan Pemeriksa</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnSubmit">💾 Simpan ke Google Sheets</button>
      <button type="reset" class="btn btn-secondary">🔄 Reset Form</button>
    </form>

    <h3 style="margin: 40px 0 20px; color: #1e3c72;">👥 Daftar Anggota KGP (<span id="jumlahAnggota">0</span>)</h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Kode</th><th>Nama</th><th>Tanggal Daftar</th><th>Jabatan</th></tr>
        </thead>
        <tbody id="tabelAnggota">
          <tr><td colspan="4" style="text-align:center;padding:20px;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '151XT0NLPb7fljwUOe_PP3dhD_-dPhBmA_jrffxGZWjQ';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzJME38r7ZR6qlZI0ZefDbk0odOf0a9CGXzFTG9FeR8yim266-ZKcz89yP6z1djV-qN/exec';
    const SHEET1_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
    
    let dataAnggota = [];

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          result.push(current); current = '';
        } else { current += char; }
      }
      result.push(current);
      return result.map(v => v.trim());
    }

    async function loadAnggota() {
      const statusBar = document.getElementById('statusBar');
      try {
        const response = await fetch(SHEET1_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Gagal');
        const text = await response.text();
        const lines = text.trim().split('\n');
        dataAnggota = [];
        const headers = parseCSVLine(lines[1]);
        for (let i = 2; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const values = parseCSVLine(lines[i]);
          const obj = {};
          headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
          dataAnggota.push(obj);
        }
        statusBar.textContent = `✅ Data dimuat: ${dataAnggota.length} anggota dari Google Sheets`;
        statusBar.className = 'status-bar success';
        renderTabel();
      } catch (e) {
        statusBar.textContent = '❌ Gagal memuat data. Periksa koneksi atau ID Spreadsheet.';
        statusBar.className = 'status-bar error';
      }
    }

    function renderTabel() {
      const tbody = document.getElementById('tabelAnggota');
      document.getElementById('jumlahAnggota').textContent = dataAnggota.length;
      if (dataAnggota.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;">Belum ada data</td></tr>';
        return;
      }
      tbody.innerHTML = dataAnggota.map(a => `
        <tr>
          <td>${a.KODE || '-'}</td>
          <td>${a.NAMA || '-'}</td>
          <td>${a['TANGGAL DAFTAR'] || '-'}</td>
          <td>${a.JABATAN || '-'}</td>
        </tr>
      `).join('');
    }

    document.getElementById('formAnggota').addEventListener('submit', async function(e) {
      e.preventDefault();
      const statusBar = document.getElementById('statusBar');
      const btnSubmit = document.getElementById('btnSubmit');
      const originalText = btnSubmit.innerHTML;
      
      btnSubmit.innerHTML = '<span class="loading"></span> Menyimpan...';
      btnSubmit.disabled = true;

      const data = {
        sheet: 'Sheet1',
        kode: document.getElementById('kode').value,
        nama: document.getElementById('nama').value,
        tanggal: document.getElementById('tanggal').value,
        jabatan: document.getElementById('jabatan').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        statusBar.textContent = '✅ Anggota berhasil ditambahkan ke Google Sheets!';
        statusBar.className = 'status-bar success';
        this.reset();
        document.getElementById('tanggal').valueAsDate = new Date();
        await loadAnggota();
      } catch (err) {
        statusBar.textContent = '❌ Gagal menyimpan. Coba lagi.';
        statusBar.className = 'status-bar error';
      } finally {
        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;
      }
    });

    document.getElementById('tanggal').valueAsDate = new Date();
    loadAnggota();
  </script>
</body>
</html>
