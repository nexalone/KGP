<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Anggota KGP</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 20px auto; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { background-color: #0F9D58; color: white; border: none; margin-top: 15px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0b7944; }
    #status { margin-top: 10px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h3>Form Input KGP</h3>
  <form id="kgpForm">
    <label>KODE:</label>
    <input type="text" id="kode" required placeholder="Contoh: 2608003">

    <label>NAMA:</label>
    <input type="text" id="nama" required placeholder="Nama Lengkap">

    <label>TANGGAL DAFTAR:</label>
    <input type="date" id="tanggal" required>

    <label>JABATAN:</label>
    <select id="jabatan">
      <option value="Anggota">Anggota</option>
      <option value="Pengurus">Pengurus</option>
    </select>

    <button type="submit" id="btnSubmit">Simpan Data</button>
  </form>

  <p id="status"></p>

  <script>
    // GANTI URL DI BAWAH DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT
    const scriptURL = 'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';

    document.getElementById('tanggal').valueAsDate = new Date(); // Auto set hari ini

    document.getElementById('kgpForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.innerText = "Mengirim data...";

      const data = {
        kode: document.getElementById('kode').value,
        nama: document.getElementById('nama').value,
        tanggal: document.getElementById('tanggal').value,
        jabatan: document.getElementById('jabatan').value
      };

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        if(response.result === 'success') {
          status.style.color = 'green';
          status.innerText = "Data berhasil disimpan!";
          document.getElementById('kgpForm').reset();
          document.getElementById('tanggal').valueAsDate = new Date();
        } else {
          throw new Error(response.error);
        }
      })
      .catch(err => {
        status.style.color = 'red';
        status.innerText = "Gagal menyimpan data!";
      })
      .finally(() => {
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
