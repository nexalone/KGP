<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#667eea" />
  <title>KGP - SMP Negeri 1 Kaliwedi</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    
    header {
      text-align: center;
      color: #fff;
      padding: 40px 20px 30px;
      margin-bottom: 30px;
    }
    
    .logo-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 15px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .logo-container img { 
      width: 80px; 
      height: 80px; 
      object-fit: contain; 
    }
    
    header h1 { 
      font-size: 1.8rem; 
      margin-bottom: 10px; 
      font-weight: 700; 
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    header h2 { 
      font-size: 1.1rem; 
      font-weight: 500; 
      opacity: 0.95; 
      letter-spacing: 0.5px;
    }
    
    header p {
      margin-top: 12px;
      font-size: 0.95rem;
      opacity: 0.85;
      font-style: italic;
    }

    /* Menu Grid - Modern Icon Only */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin: 40px 0 30px;
    }
    
    .menu-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 30px 30px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 15px 40px rgba(0,0,0,0.18);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.35);
      position: relative;
      overflow: hidden;
    }
    
    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s;
    }
    
    .menu-card:hover::before { left: 100%; }
    
    .menu-card:hover {
      transform: translateY(-15px) scale(1.03);
      box-shadow: 0 28px 60px rgba(0,0,0,0.25);
    }

    .menu-card .icon {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .menu-card:hover .icon {
      transform: scale(1.12) rotate(6deg);
    }

    .menu-card.anggota .icon { 
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }
    
    .menu-card.transaksi .icon { 
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .menu-card h3 { 
      font-size: 1.45rem; 
      font-weight: 700; 
      color: #2d3748;
      letter-spacing: -0.5px;
    }

    /* Install Button Modern */
    .install-btn {
      display: block;
      margin: 40px auto 0;
      padding: 16px 40px;
      background: rgba(255, 255, 255, 0.95);
      color: #667eea;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-decoration: none;
      width: fit-content;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.5);
    }
    
    .install-btn:hover { 
      background: #fff;
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    /* Footer */
    footer {
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: 0.9rem;
      margin-top: 50px;
      padding: 20px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 { font-size: 1.5rem; }
      header h2 { font-size: 1.05rem; }
      .menu-grid { grid-template-columns: 1fr; }
      .menu-card { padding: 35px 25px; }
      .logo-container { width: 95px; height: 95px; }
      .logo-container img { width: 70px; height: 70px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj_B7CwV-8fChbKdjVlBPyzW64K2ROcs4MLQfoZTxXrFG-fYMopVJWpISURDn0mIvbGtY6EqS2VYA1mizLD10nI104RiG2WvcP64AeSjDXW9C2_MxIEma_CsaT68v_yzY5MvSZE62eoeaPg_W3BuctXGM_iLnuYoIze6yS2di45nsiS9OFdvx0HtAj-xKs/s2145/logo_smp.png" alt="Logo SMPN 1 Kaliwedi" />
      </div>
      <h1>KESEJAHTERAAN GURU DAN PEGAWAI</h1>
      <h2>SMP NEGERI 1 KALIWEDI</h2>
      <p>Portal Sistem Informasi Internal</p>
    </header>

    <nav class="menu-grid">
      <a href="anggota-kgp.html" class="menu-card anggota">
        <div class="icon">👥</div>
        <h3>Form Data Anggota</h3>
      </a>

      <a href="transaksi-kgp.html" class="menu-card transaksi">
        <div class="icon">💳</div>
        <h3>Transaksi Keuangan</h3>
      </a>
    </nav>

    <button class="install-btn" onclick="installApp()">
       Instal Aplikasi KGP
    </button>

    <footer>
      © 2026 KGP SMP Negeri 1 Kaliwedi. All rights reserved.
    </footer>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { 
          deferredPrompt = null; 
        });
      } else {
        alert('Untuk menginstal aplikasi:\n\n1. Buka menu browser (⋮)\n2. Pilih "Tambahkan ke Layar Utama"\n3. Klik "Instal"');
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
