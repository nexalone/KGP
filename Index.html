<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#667eea" />
  <title>KGP - SMP Negeri 1 Kaliwedi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      color: #fff;
      padding: 40px 20px 30px;
      margin-bottom: 20px;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 14px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .logo-container img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    header h2 {
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.95;
      letter-spacing: 0.5px;
    }

    header p {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.85;
      font-style: italic;
    }

    /* Menu — baris ikon sederhana, 3 per baris */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 30px 0;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 22px 10px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.35);
    }

    .menu-card:active,
    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.22);
    }

    .menu-card .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }

    .menu-card.anggota .icon {
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }

    .menu-card.transaksi .icon {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .menu-card.kartu .icon {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .menu-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    footer {
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: 0.85rem;
      margin-top: 40px;
      padding: 20px;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      header h2 { font-size: 0.9rem; }
      .menu-grid { gap: 10px; }
      .menu-card { padding: 16px 6px; border-radius: 14px; }
      .menu-card .icon { width: 46px; height: 46px; font-size: 1.4rem; }
      .menu-card h3 { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj_B7CwV-8fChbKdjVlBPyzW64K2ROcs4MLQfoZTxXrFG-fYMopVJWpISURDn0mIvbGtY6EqS2VYA1mizLD10nI104RiG2WvcP64AeSjDXW9C2_MxIEma_CsaT68v_yzY5MvSZE62eoeaPg_W3BuctXGM_iLnuYoIze6yS2di45nsiS9OFdvx0HtAj-xKs/s2145/logo_smp.png" alt="Logo SMPN 1 Kaliwedi" />
      </div>
      <h1>KESEJAHTERAAN GURU DAN PEGAWAI</h1>
      <h2>SMP NEGERI 1 KALIWEDI</h2>
      <p>Portal Sistem Informasi Internal</p>
    </header>

    <nav class="menu-grid">
      <a href="anggota-kgp.html" class="menu-card anggota">
        <div class="icon">👥</div>
        <h3>Data Anggota</h3>
      </a>

      <a href="transaksi-kgp.html" class="menu-card transaksi">
        <div class="icon">💳</div>
        <h3>Transaksi</h3>
      </a>

      <a href="kartu-anggota.html" class="menu-card kartu">
        <div class="icon">🪪</div>
        <h3>Kartu Anggota</h3>
      </a>
    </nav>

    <footer>
      © 2026 KGP SMP Negeri 1 Kaliwedi. All rights reserved.
    </footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
